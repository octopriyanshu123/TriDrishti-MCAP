// Copied from Foxglove's schemas (https://github.com/foxglove/schemas).
// Field numbers must match the upstream definition for Foxglove to decode it.
syntax = "proto3";

import "google/protobuf/timestamp.proto";

package foxglove;

// A compressed image
message CompressedImage {
  // Timestamp of image
  google.protobuf.Timestamp timestamp = 1;

  // Frame of reference for the image. The origin of the frame is the optical center of the camera.
  string frame_id = 4;

  // Compressed image data
  bytes data = 2;

  // Image format (e.g. "jpeg", "png", "webp")
  string format = 3;
}

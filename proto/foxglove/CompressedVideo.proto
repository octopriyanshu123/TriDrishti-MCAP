// Copied from Foxglove's schemas (https://github.com/foxglove/schemas).
// Field numbers must match the upstream definition for Foxglove to decode it.
syntax = "proto3";

import "google/protobuf/timestamp.proto";

package foxglove;

// A single frame of a compressed video bitstream
message CompressedVideo {
  // Timestamp of video frame
  google.protobuf.Timestamp timestamp = 1;

  // Frame of reference for the video. The origin of the frame is the optical center of the camera.
  string frame_id = 2;

  // Compressed video frame data. For H.264: Annex B formatted, one access unit per message,
  // and keyframes must include SPS and PPS. B-frames are not supported.
  bytes data = 3;

  // Video format. Supported values: "h264", "h265", "vp9", "av1"
  string format = 4;
}
